# Nginx config for SLS Powder API
# Place at: /etc/nginx/sites-available/sls-api
# Enable: ln -s /etc/nginx/sites-available/sls-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.desousaalves-powder-ratio-model.com;
    # Certbot will add HTTPS block below after: certbot --nginx -d api.desousaalves-powder-ratio-model.com
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.desousaalves-powder-ratio-model.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.desousaalves-powder-ratio-model.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.desousaalves-powder-ratio-model.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
